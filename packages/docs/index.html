<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flow-ts • docs</title>
    <!--
      The theme script is injected here by the `theme-init-script` plugin in
      `vite.config.ts`, from `src/theme.ts`. It has to be inline and it has to
      be first: a module script runs after the stylesheet is applied, so the
      page would paint in the default palette and flip a frame later.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
